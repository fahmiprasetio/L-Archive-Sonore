# Dependabot — pembaruan dependency otomatis (mingguan).
# Membuka PR ke branch default (main) saat ada versi baru / patch keamanan.
# Docs: https://docs.github.com/code-security/dependabot
version: 2
updates:
  # Dependency npm (aplikasi Next.js).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # Kelompokkan update minor & patch agar tidak banjir PR.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions yang dipakai di workflow CI.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
